{% extends "auth_base.html" %}
{% block title %}Sign in · Bejitech{% endblock %}
{% block auth %}
<h1>Sign in</h1>
{% if note %}<p class="note">{{ note }}</p>{% endif %}
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="stack">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Username<input name="username" value="{{ username }}" autocomplete="username" autocapitalize="none" required autofocus></label>
  <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
  <button class="btn primary" type="submit">Continue</button>
</form>
<p class="muted small">Step 1 of 2. Next you'll enter the code from your authenticator app.</p>
{% endblock %}
