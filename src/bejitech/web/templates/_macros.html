{% macro head(title, subtitle="") %}
<div class="page-head">
  <div><h1>{{ title }}</h1>{% if subtitle %}<p class="muted">{{ subtitle }}</p>{% endif %}</div>
  <div class="head-actions">{{ caller() if caller else "" }}</div>
</div>
{% endmacro %}
{% macro csrf_field(csrf) %}<input type="hidden" name="csrf" value="{{ csrf }}">{% endmacro %}
{% macro state_pill(state, label) %}<span class="state s-{{ state | lower }}">{{ label }}</span>{% endmacro %}
