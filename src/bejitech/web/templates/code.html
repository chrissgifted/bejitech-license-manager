{% extends "auth_base.html" %}
{% block title %}Enter code · Bejitech{% endblock %}
{% block auth %}
<h1>Enter your code</h1>
<p class="muted">Open your authenticator app and type the 6-digit code for Bejitech License Manager.</p>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login/code" class="stack">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>6-digit code<input name="code" inputmode="numeric" pattern="[0-9 ]{6,7}" maxlength="7" autocomplete="one-time-code" class="code" required autofocus></label>
  <button class="btn primary" type="submit">Sign in</button>
</form>
<p class="small"><a href="/login">Start again</a></p>
{% endblock %}
