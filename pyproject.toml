[project]
name = "bejitech-license-manager"
version = "1.0.1"
description = "Offline desktop application for managing software licence keys, sales and delivery notes."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/bejitech"]
omit = ["src/bejitech/ui/*", "src/bejitech/app.py", "src/bejitech/__main__.py"]
